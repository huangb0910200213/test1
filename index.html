<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;padding:0;background:#000;color:#fff;font-family:-apple-system,sans-serif;}
  #player{width:100%;aspect-ratio:16/9;}
  #player iframe{width:100%;height:100%;border:0;}
  #list{display:flex;overflow-x:auto;gap:8px;padding:8px;}
  .item{flex:0 0 140px;cursor:pointer;}
  .item img{width:100%;border-radius:6px;display:block;}
  .item p{font-size:12px;margin:4px 0;line-height:1.3;}
</style>
</head>
<body>
<div id="player">
  <iframe id="mainFrame"
    src="https://www.youtube.com/embed/videoseries?list=UUBKDRq35-L8xev4O7ZqBeLg"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="autoplay; encrypted-media; fullscreen"
    allowfullscreen></iframe>
</div>
<div id="list">加载中...</div>

<script>
const API_KEY = "AIzaSyDJD_Ey1aOwrpgcgKfP0anJlfwc3mYDMY8";
const PLAYLIST_ID = "UUBKDRq35-L8xev4O7ZqBeLg";

fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=25&playlistId=${PLAYLIST_ID}&key=${API_KEY}`)
  .then(r => r.json())
  .then(data => {
    const listEl = document.getElementById('list');
    listEl.innerHTML = '';
    data.items.forEach(item => {
      const videoId = item.snippet.resourceId.videoId;
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `<img src="${item.snippet.thumbnails.medium.url}"><p>${item.snippet.title}</p>`;
      div.onclick = () => {
        document.getElementById('mainFrame').src =
          `https://www.youtube.com/embed/${videoId}?autoplay=1&list=${PLAYLIST_ID}`;
      };
      listEl.appendChild(div);
    });
  });
</script>
</body>
</html>
