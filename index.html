<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;}
  #wrap{position:relative;overflow:hidden;}
  #inner{position:absolute;top:0;left:0;transform-origin:top left;}
  iframe{width:640px;height:360px;border:0;display:block;}
</style>
</head>
<body>
<div id="wrap">
  <div id="inner">
    <iframe
      src="https://www.youtube.com/embed/videoseries?list=UUBKDRq35-L8xev4O7ZqBeLg"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="autoplay; encrypted-media; fullscreen"
      allowfullscreen>
    </iframe>
  </div>
</div>
<script>
  function resize(){
    var scale = window.innerWidth / 640;
    document.getElementById('inner').style.transform = 'scale(' + scale + ')';
    document.getElementById('wrap').style.width = window.innerWidth + 'px';
    document.getElementById('wrap').style.height = (360 * scale) + 'px';
  }
  window.onresize = resize;
  resize();
</script>
</body>
</html>
