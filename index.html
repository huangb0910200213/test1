<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的频道</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>我的频道</h1></header>
<div id="channelGrid" class="grid"></div>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
async function init() {
  const grid = document.getElementById('channelGrid');
  grid.innerHTML = '<p class="loading">加载中...</p>';
  try {
    const ids = CHANNELS.map(c => c.id).join(',');
    const data = await ytFetch('channels', { part: 'snippet,statistics', id: ids });
    grid.innerHTML = '';
    data.items.forEach(ch => {
      const card = document.createElement('a');
      card.className = 'card channel-card';
      card.href = `channel.html?id=${ch.id}`;
      card.innerHTML = `
        <img src="${ch.snippet.thumbnails.medium.url}" class="avatar">
        <div class="card-body">
          <h3>${ch.snippet.title}</h3>
          <p class="muted">${Number(ch.statistics.subscriberCount).toLocaleString()} 订阅</p>
        </div>`;
      grid.appendChild(card);
    });
  } catch (e) {
    grid.innerHTML = `<p class="error">加载失败: ${e.message}</p>`;
  }
}
init();
</script>
</body>
</html>
