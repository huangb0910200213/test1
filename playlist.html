<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>播放列表</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a id="backLink" href="index.html" class="back">← 返回频道</a>
  <h1 id="playlistTitle">加载中...</h1>
</header>
<p id="playlistDesc" class="muted" style="padding:0 16px;"></p>

<div id="videoGrid" class="grid"></div>
<div class="pagination">
  <button id="prevBtn" disabled>上一页</button>
  <span id="pageInfo" class="page-info"></span>
  <button id="nextBtn" disabled>下一页</button>
</div>

<script src="common.js"></script>
<script>
const playlistId = qs('list');
const channelId = qs('channel');
if (channelId) document.getElementById('backLink').href = `channel.html?id=${channelId}`;

let tokens = { current: '', prev: [], next: '' };
let pageNum = 1;

async function loadPlaylistInfo() {
  const data = await ytFetch('playlists', { part: 'snippet', id: playlistId });
  const pl = data.items[0];
  document.getElementById('playlistTitle').textContent = pl.snippet.title;
  document.getElementById('playlistDesc').textContent = pl.snippet.description || '';
}

async function loadVideos(pageToken = '') {
  const grid = document.getElementById('videoGrid');
  grid.innerHTML = '<p class="loading">加载中...</p>';
  const data = await ytFetch('playlistItems', { part: 'snippet', playlistId, maxResults: 50, pageToken });
  grid.innerHTML = '';
  data.items.forEach(item => {
    const videoId = item.snippet.resourceId.videoId;
    const card = document.createElement('a');
    card.className = 'card video-card';
    card.dataset.videoId = videoId;
    card.href = `watch.html?v=${videoId}&list=${playlistId}${channelId ? '&channel=' + channelId : ''}`;
    card.innerHTML = `
      <div class="thumb"><img src="${item.snippet.thumbnails.medium.url}"></div>
      <div class="card-body">
        <p class="title">${item.snippet.title}</p>
        <p class="muted">${formatDate(item.snippet.publishedAt)}</p>
      </div>`;
    grid.appendChild(card);
  });
  tokens.current = pageToken;
  tokens.next = data.nextPageToken || '';
  document.getElementById('prevBtn').disabled = tokens.prev.length === 0;
  document.getElementById('nextBtn').disabled = !tokens.next;
  const totalPages = Math.max(1, Math.ceil(data.pageInfo.totalResults / data.pageInfo.resultsPerPage));
  document.getElementById('pageInfo').textContent = `第 ${pageNum} 页 / 共 ${totalPages} 页`;
  const ids = data.items.map(item => item.snippet.resourceId.videoId);
  fetchVideoDurations(ids).then(m => attachDurations(grid, m)).catch(() => {});
}

document.getElementById('nextBtn').onclick = () => {
  tokens.prev.push(tokens.current);
  pageNum++;
  loadVideos(tokens.next);
};
document.getElementById('prevBtn').onclick = () => {
  const token = tokens.prev.pop() || '';
  pageNum--;
  loadVideos(token);
};

// ============ 从播放页返回时恢复原位置 ============
const STATE_KEY = 'playlistState';

function saveState() {
  sessionStorage.setItem(STATE_KEY, JSON.stringify({ tokens, pageNum, scrollY: window.scrollY }));
}
document.getElementById('videoGrid').addEventListener('click', saveState);

// bfcache 已原样还原页面时,清掉备用状态
window.addEventListener('pageshow', (e) => {
  if (e.persisted) sessionStorage.removeItem(STATE_KEY);
});

attachBack(document.getElementById('backLink'));

(async () => {
  await loadPlaylistInfo();
  let s = null;
  if (/\/watch\.html(\?|$)/.test(document.referrer)) {
    try { s = JSON.parse(sessionStorage.getItem(STATE_KEY) || 'null'); } catch (e) {}
  }
  sessionStorage.removeItem(STATE_KEY);
  if (s) {
    Object.assign(tokens, { current: '', prev: [], next: '' }, s.tokens);
    pageNum = s.pageNum || 1;
    await loadVideos(tokens.current);
    window.scrollTo(0, s.scrollY || 0);
  } else {
    await loadVideos();
  }
})();
</script>
</body>
</html>
