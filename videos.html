<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频列表</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a href="index.html" class="back">← 首页</a>
  <h1>视频列表</h1>
</header>

<div id="videoGrid" class="grid"></div>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
const STATE_KEY = 'videosState';

function init() {
  const grid = document.getElementById('videoGrid');
  VIDEOS.forEach(v => {
    const card = document.createElement('a');
    card.className = 'card video-card';
    card.dataset.videoId = v.id;
    card.href = `watch.html?v=${v.id}`;
    card.innerHTML = `
      <div class="thumb">
        <img src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg">
      </div>
      <div class="card-body">
        <p class="title">${v.title || v.id}</p>
      </div>`;
    grid.appendChild(card);
  });
  fetchVideoDurations(VIDEOS.map(v => v.id)).then(m => attachDurations(grid, m)).catch(() => {});
  restoreScroll();
}
init();

// 点视频卡时记下滚动位置,返回时备用
function saveState() {
  sessionStorage.setItem(STATE_KEY, String(window.scrollY));
}
document.getElementById('videoGrid').addEventListener('click', saveState);

// bfcache 已经原样还原页面时,清掉备用状态
window.addEventListener('pageshow', (e) => {
  if (e.persisted) sessionStorage.removeItem(STATE_KEY);
});

// 从播放页返回且 bfcache 失效时,恢复滚动位置
function restoreScroll() {
  if (!/\/watch\.html(\?|$)/.test(document.referrer)) {
    sessionStorage.removeItem(STATE_KEY);
    return;
  }
  const y = Number(sessionStorage.getItem(STATE_KEY)) || 0;
  sessionStorage.removeItem(STATE_KEY);
  window.scrollTo(0, y);
}
</script>
</body>
</html>
